<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do App</title>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #9b59b6;
            --secondary: #fd79a8;
            --success: #55efc4;
            --error: #fab1a0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Chewy', cursive;
            margin: 0;
            background: linear-gradient(135deg, #fceabb, #f8b500);
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 10px;
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            border: 5px solid transparent;
            border-image: linear-gradient(45deg, #fd79a8, #a29bfe);
            border-image-slice: 1;
        }

        h1 {
            font-size: 3rem;
            color: #6c5ce7;
            text-align: center;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-group input {
            flex: 1;
            padding: 15px;
            border-radius: 12px;
            border: 3px solid #dfe6e9;
            font-size: 1.1rem;
            outline: none;
            font-family: 'Chewy', cursive;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(155, 89, 182, 0.2);
        }

        .input-group button {
            padding: 15px 25px;
            background: linear-gradient(to right, #fd79a8, #a29bfe);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .input-group button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 118, 117, 0.3);
        }

        .main-list {
            margin-top: 20px;
        }

        .main-list .item {
            display: flex;
            align-items: center;
            background: #f8f9fa;
            border: 2px solid white;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .main-list .item:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .main-list span {
            flex: 1;
            font-size: 1.2rem;
            color: #6c5ce7;
            margin-left: 15px;
            transition: 0.3s;
        }

        .main-list .checked {
            text-decoration: line-through;
            color: #b2bec3 !important;
        }

        .main-list button {
            background-color: #d63031;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .main-list button:hover {
            background-color: #e17055;
        }

        input[type="checkbox"] {
            width: 25px;
            height: 25px;
            border: 3px solid var(--secondary);
            border-radius: 6px;
            cursor: pointer;
            appearance: none;
            position: relative;
            transition: all 0.2s ease-in-out;
        }

        input[type="checkbox"]:checked {
            background-color: var(--success);
            border-color: var(--success);
        }

        input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: -2px;
            left: 6px;
            font-size: 18px;
            color: white;
            font-weight: bold;
        }

        input[type="checkbox"]:hover {
            transform: scale(1.2);
        }

        @media (max-width: 600px) {
            .input-group {
                flex-direction: column;
            }

            .input-group button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>To-Do List</h1>
        <div class="input-group">
            <input class="main" type="text" placeholder="e.g. Water the plants" onkeypress="handleKeyPress(event)">
            <button onclick="createList()">Add</button>
        </div>
        <div class="main-list"></div>
    </div>

    <script>
        function createList() {
            const input = document.querySelector("input.main");
            const text = input.value.trim();
            if (!text) return;

            const list = document.querySelector(".main-list");

            const item = document.createElement("div");
            item.className = "item";

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.onclick = () => {
                span.classList.toggle("checked");
            };

            const span = document.createElement("span");
            span.textContent = text;

            const delBtn = document.createElement("button");
            delBtn.textContent = "Delete";
            delBtn.onclick = () => {
                item.style.opacity = 0;
                item.style.transform = 'translateX(100%)';
                setTimeout(() => item.remove(), 300);
            };

            item.appendChild(checkbox);
            item.appendChild(span);
            item.appendChild(delBtn);
            list.appendChild(item);

            input.value = "";
            input.focus();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                createList();
            }
        }
    </script>

</body>

</html>
